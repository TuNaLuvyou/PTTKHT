services:
  db:
    image: postgres:16-alpine
    container_name: nexcvd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexcvd
      POSTGRES_PASSWORD: nexcvd_secret
      POSTGRES_DB: nexcvd
      # Deterministic collation so Prisma migrations behave the same everywhere
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # host:container — 5442 on the host to avoid clashing with other
      # PostgreSQL instances that may already use 5432.
      - "5442:5432"
    volumes:
      - nexcvd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexcvd -d nexcvd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexcvd_pgdata:
